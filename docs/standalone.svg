<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ESP32-DATV-SA — stand-alone DATV transmitter</text>

  <!-- optional front panel -->
  <rect x="20" y="60" width="230" height="300" rx="10" fill="#f4f7fb" stroke="#7a8ca5" stroke-dasharray="6,4"/>
  <text x="135" y="82" text-anchor="middle" font-weight="bold" fill="#33475b">Front panel (optional, planned)</text>
  <rect x="45" y="100" width="180" height="90" rx="6" fill="#20303f" stroke="#111"/>
  <rect x="55" y="110" width="160" height="70" fill="#9fd3a8"/>
  <text x="62" y="130" font-family="monospace" font-size="12" fill="#123">2404.750 MHz</text>
  <text x="62" y="147" font-family="monospace" font-size="12" fill="#123">S2 QPSK 3/4 333k</text>
  <text x="62" y="164" font-family="monospace" font-size="12" fill="#123">TX ON   PA OFF</text>
  <text x="135" y="208" text-anchor="middle" fill="#33475b">LCD (I²C / SPI)</text>
  <circle cx="135" cy="265" r="32" fill="#d9dde3" stroke="#555" stroke-width="2"/>
  <circle cx="135" cy="265" r="14" fill="#9aa3ad" stroke="#555"/>
  <line x1="135" y1="251" x2="135" y2="240" stroke="#333" stroke-width="3"/>
  <text x="135" y="322" text-anchor="middle" fill="#33475b">Rotary encoder</text>
  <text x="135" y="340" text-anchor="middle" fill="#33475b">+ push button</text>

  <!-- ESP32-C3 -->
  <rect x="320" y="110" width="220" height="190" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
  <text x="430" y="138" text-anchor="middle" font-weight="bold" font-size="16" fill="#6b4200">ESP32-C3</text>
  <text x="430" y="166" text-anchor="middle" fill="#6b4200">beacon loop in flash → RAM</text>
  <text x="430" y="188" text-anchor="middle" fill="#6b4200">DVB-S2 symbols</text>
  <text x="430" y="210" text-anchor="middle" fill="#6b4200">RRC filter (α 0.35)</text>
  <text x="430" y="232" text-anchor="middle" fill="#6b4200">I/Q → Wi-Fi DAC</text>
  <text x="430" y="254" text-anchor="middle" fill="#6b4200">2.4 GHz RF block</text>
  <text x="430" y="284" text-anchor="middle" font-size="12" fill="#8a6a30">GPIO3 = PA enable</text>

  <!-- links panel -> ESP -->
  <line x1="250" y1="160" x2="318" y2="160" stroke="#444" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="250" y1="265" x2="318" y2="265" stroke="#444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="284" y="152" text-anchor="middle" font-size="11" fill="#555">display</text>
  <text x="284" y="257" text-anchor="middle" font-size="11" fill="#555">control</text>

  <!-- PA + antenna -->
  <rect x="610" y="170" width="110" height="70" rx="8" fill="#eaf5ea" stroke="#3c8a3c" stroke-width="2"/>
  <text x="665" y="200" text-anchor="middle" font-weight="bold" fill="#225522">PA</text>
  <text x="665" y="220" text-anchor="middle" font-size="12" fill="#225522">(external)</text>
  <line x1="540" y1="205" x2="608" y2="205" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="574" y="197" text-anchor="middle" font-size="11" fill="#555">RF</text>
  <line x1="720" y1="205" x2="780" y2="205" stroke="#444" stroke-width="2"/>
  <line x1="780" y1="205" x2="780" y2="140" stroke="#444" stroke-width="2"/>
  <path d="M760,110 L780,140 L800,110 Z" fill="none" stroke="#444" stroke-width="2"/>
  <path d="M812,105 q12,12 0,24 M824,97 q20,20 0,40" fill="none" stroke="#888" stroke-width="2"/>
  <text x="780" y="260" text-anchor="middle" font-size="12" fill="#555">2.4 GHz</text>
  <text x="780" y="276" text-anchor="middle" font-size="12" fill="#555">(e.g. QO-100 uplink)</text>

  <!-- optional PC -->
  <rect x="345" y="345" width="170" height="50" rx="8" fill="#f2f2f2" stroke="#999" stroke-dasharray="6,4"/>
  <text x="430" y="368" text-anchor="middle" fill="#555">PC (optional)</text>
  <text x="430" y="385" text-anchor="middle" font-size="11" fill="#777">USB: original live-video mode</text>
  <line x1="430" y1="343" x2="430" y2="302" stroke="#999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>

  <!-- power -->
  <text x="430" y="95" text-anchor="middle" font-size="12" fill="#555">5 V power → transmits the beacon at boot, no PC needed</text>
</svg>
